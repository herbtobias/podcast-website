# Vite/React SPA - statisches Bundle aus `npm run build`
# Ziel: /etc/nginx/sites-available/zukunft-ist-relativ.conf
# Aktivieren: ln -s ../sites-available/zukunft-ist-relativ.conf /etc/nginx/sites-enabled/
#
# HTTPS-Redirect und den listen-443-Block ergaenzt certbot automatisch:
#   certbot --nginx -d zukunft-ist-relativ.de -d www.zukunft-ist-relativ.de

# Apex -> www (Canonicals, OG-Tags und Sitemap zeigen alle auf www)
server {
    listen 80;
    listen [::]:80;
    server_name zukunft-ist-relativ.de;
    return 301 https://www.zukunft-ist-relativ.de$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.zukunft-ist-relativ.de;

    root /var/www/zir;
    index index.html;

    charset utf-8;

    # SPA-Fallback: ersetzt das Netlify/Bolt-`_redirects`.
    # Ohne diesen Block liefern Deep-Links wie /episode/12 oder /admin einen 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite haengt einen Content-Hash an jeden Asset-Namen -> unbegrenzt cachebar
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nie cachen, sonst bleiben Besucher nach einem Deploy
    # auf der alten Datei und laden nicht mehr existierende Asset-Hashes
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Versteckte Dateien nicht ausliefern
    location ~ /\. { deny all; }
}
