# nginx im Container. TLS, Domain-Routing und Zertifikate macht Traefik
# vor dem Container (Coolify) - hier laeuft bewusst nur Port 80 ohne TLS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Healthcheck fuer Docker und Coolify.
    # Eigene location, damit der www-Redirect weiter unten ihn nicht erwischt -
    # der laeuft ueber 127.0.0.1, nicht ueber die echte Domain.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Apex -> www. Canonicals, OG-Tags und die Sitemap zeigen alle auf www,
        # also muss die nackte Domain dorthin umleiten. Ziel fest auf https,
        # weil Traefik das TLS bereits terminiert hat.
        if ($host = "zukunft-ist-relativ.de") {
            return 301 https://www.zukunft-ist-relativ.de$request_uri;
        }

        # SPA-Fallback: ersetzt das Bolt/Netlify-`_redirects`.
        # Ohne diese Zeile liefern Deep-Links wie /episode/12 oder /admin
        # beim direkten Aufruf einen 404.
        try_files $uri $uri/ /index.html;
    }

    # Vite haengt an jeden Asset-Namen einen Content-Hash -> unbegrenzt cachebar.
    location /assets/ {
        # Kein `expires` hier: das wuerde einen zweiten Cache-Control-Header
        # setzen und der Browser nimmt den ersten - ohne `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html darf nie gecacht werden, sonst bleiben Besucher nach einem
    # Deploy auf der alten Datei haengen, die auf nicht mehr existierende
    # Asset-Hashes zeigt.
    # Die Security-Header stehen hier nochmal, weil ein add_header in einer
    # location die vom server-Block geerbten Header ersetzt.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    location ~ /\. { deny all; }
}
